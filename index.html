<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera clips</title>
<style>
  :root {
    --bg: #12161B;
    --panel: #1A1F27;
    --line: #2B323C;
    --text: #D6DDE6;
    --dim: #79848F;
    --amber: #E0A33E;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .spacer { flex: 1; }
  header .meta { color: var(--dim); font-size: 13px; }
  .ghost {
    background: none; border: 1px solid var(--line); color: var(--text);
    border-radius: 5px; padding: 6px 12px;
  }
  .ghost:hover { border-color: var(--dim); }
  .solid {
    background: var(--amber); color: #16191D; border: 0; font-weight: 600;
    border-radius: 5px; padding: 8px 16px;
  }
  .solid:hover { filter: brightness(1.08); }

  /* ---- library ---- */
  #library { flex: 1; overflow-y: auto; padding: 20px; }
  #library.hide, #viewer.hide { display: none; }

  #empty {
    height: 100%;
    border: 1px dashed var(--line);
    border-radius: 8px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; text-align: center; padding: 24px;
  }
  #empty.over { border-color: var(--amber); background: rgba(224,163,62,.05); }
  #empty strong { font-size: 18px; }
  #empty span { color: var(--dim); font-size: 13px; max-width: 48ch; }
  #empty .row { display: flex; gap: 10px; margin-top: 10px; }

  .daygroup { margin-bottom: 26px; }
  .daygroup h2 {
    font-size: 13px; font-weight: 600; color: var(--dim);
    margin: 0 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(208px, 1fr));
    gap: 14px;
  }
  .card {
    background: none; border: 0; padding: 0; text-align: left;
    border-radius: 6px; overflow: hidden; color: inherit;
  }
  .card .shot {
    aspect-ratio: 16 / 9;
    background: #0C0F13;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    display: grid; place-items: center;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .shot .wait { color: var(--dim); font-size: 12px; }
  .card:hover .shot { border-color: var(--amber); }
  .card .len {
    position: absolute; right: 6px; bottom: 6px;
    background: rgba(10,13,16,.82);
    padding: 1px 6px; border-radius: 3px;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .card .when {
    margin-top: 7px;
    font: 14px ui-monospace, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .card .file { color: var(--dim); font-size: 12px; margin-top: 1px; }
  .card.bad .shot { border-style: dashed; }
  .card.bad .when { color: var(--dim); }

  /* ---- viewer ---- */
  #viewer { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #stage { flex: 1; display: grid; place-items: center; background: #0C0F13; min-height: 0; }
  #canvas { max-width: 100%; max-height: 100%; }
  #bar {
    flex: none; border-top: 1px solid var(--line); background: var(--panel);
    padding: 10px 16px 13px; display: flex; align-items: center; gap: 14px;
  }
  #bar button.t {
    background: none; border: 1px solid var(--line); color: var(--text);
    border-radius: 5px; width: 34px; height: 30px; display: grid; place-items: center;
  }
  #bar button.t:hover { border-color: var(--dim); }
  #time {
    font: 13px ui-monospace, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; color: var(--dim); flex: none;
  }
  #track { flex: 1; height: 22px; display: flex; align-items: center; cursor: pointer; }
  #rail { width: 100%; height: 4px; background: var(--line); border-radius: 2px; position: relative; }
  #fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--amber); border-radius: 2px; }
  .key { position: absolute; top: -3px; width: 1px; height: 10px; background: var(--dim); opacity: .5; }

  #note {
    padding: 9px 20px; color: var(--amber); font-size: 13px;
    display: none; border-top: 1px solid var(--line); flex: none;
  }
  #note.show { display: block; }
</style>
</head>
<body>

<header>
  <h1 id="title">Camera clips</h1>
  <span class="meta" id="count"></span>
  <div class="spacer"></div>
  <button class="ghost" id="back" hidden>Back to clips</button>
  <button class="ghost" id="more" hidden>Open another folder</button>
</header>

<section id="library">
  <div id="empty">
    <strong>Choose the folder from your SD card</strong>
    <span>Every clip is listed with the time it was recorded. Nothing is uploaded — the files never leave your computer.</span>
    <div class="row">
      <button class="solid" id="pickFolder">Choose folder</button>
      <button class="ghost" id="pickFiles">Choose files instead</button>
    </div>
    <input id="fileFolder" type="file" webkitdirectory directory multiple hidden>
    <input id="fileAny" type="file" multiple hidden>
  </div>
  <div id="groups"></div>
</section>

<section id="viewer" class="hide">
  <div id="stage"><canvas id="canvas"></canvas></div>
  <div id="bar">
    <button class="t" id="play" title="Play or pause">▶</button>
    <span id="time">0:00.0 / 0:00.0</span>
    <div id="track"><div id="rail"><div id="fill"></div></div></div>
    <button class="t" id="prev" title="Previous clip">⏮</button>
    <button class="t" id="next" title="Next clip">⏭</button>
    <button class="t" id="full" title="Fullscreen">⛶</button>
  </div>
</section>

<div id="note"></div>

<script>
"use strict";

/* ---------------------------------------------------------------------------
   Container format
     24-byte chunk header, little-endian:
       uint32 type    0 = video P-frame, 1 = video keyframe, 3 = G.711 audio
       uint32 length  payload bytes
       uint64 wall    Unix epoch milliseconds  (the recording date and time)
       uint64 media   video microseconds / audio milliseconds
     Video payloads are H.264 Annex-B; each keyframe chunk carries its own
     SPS and PPS, so any keyframe is a valid decode start point.
--------------------------------------------------------------------------- */

const HDR = 24, T_P = 0, T_KEY = 1, T_AUDIO = 3, ARATE = 8000;
const HEAD_BYTES = 1 << 20;     // enough for the opening keyframe
const TAIL_BYTES = 1 << 18;     // enough to find the final timestamp

const MULAW = (() => {
  const t = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const u = ~i & 0xFF;
    const mag = (((u & 0x0F) << 3) + 0x84) << ((u >> 4) & 0x07);
    const s = mag - 0x84;
    t[i] = ((u & 0x80) ? -s : s) / 32768;
  }
  return t;
})();

function validChunk(type, len) {
  return (type === T_P || type === T_KEY || type === T_AUDIO)
    && len > 0 && len <= 64 * 1024 * 1024;
}

function codecFromKeyframe(data) {
  for (let i = 0; i + 6 < data.length; i++) {
    if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 1 && (data[i + 3] & 0x1F) === 7) {
      const hex = n => n.toString(16).padStart(2, "0");
      return "avc1." + hex(data[i + 4]) + hex(data[i + 5]) + hex(data[i + 6]);
    }
  }
  return "avc1.64001F";
}

/* Full parse — used when a clip is actually played. */
function parseMedia(buffer) {
  const view = new DataView(buffer), bytes = new Uint8Array(buffer);
  const video = [], audio = [];
  let off = 0, startWall = null;
  while (off + HDR <= bytes.length) {
    const type = view.getUint32(off, true);
    const len = view.getUint32(off + 4, true);
    if (!validChunk(type, len) || off + HDR + len > bytes.length) break;
    const wall = Number(view.getBigUint64(off + 8, true));
    const ts = Number(view.getBigUint64(off + 16, true));
    const data = bytes.subarray(off + HDR, off + HDR + len);
    if (startWall === null) startWall = wall;
    if (type === T_P || type === T_KEY) video.push({ t: ts / 1e6, key: type === T_KEY, data });
    else audio.push({ t: ts / 1e3, data });
    off += HDR + len;
  }
  if (!video.length || !video.some(v => v.key)) {
    throw new Error("no playable video found — this doesn't look like a camera .media file");
  }
  const t0 = Math.min(video[0].t, audio.length ? audio[0].t : video[0].t);
  for (const v of video) v.t -= t0;

  let pcm = null;
  if (audio.length) {
    const pad = Math.max(0, Math.round((audio[0].t - t0) * ARATE));
    const total = audio.reduce((n, a) => n + a.data.length, 0);
    pcm = new Float32Array(pad + total);
    let i = pad;
    for (const a of audio) for (const b of a.data) pcm[i++] = MULAW[b];
  }
  return {
    video, pcm, startWall,
    duration: Math.max(video[video.length - 1].t, pcm ? pcm.length / ARATE : 0),
    codec: codecFromKeyframe(video.find(v => v.key).data)
  };
}

/* Head parse — reads only the opening slice, for the thumbnail and start time. */
function parseHead(buffer) {
  const view = new DataView(buffer), bytes = new Uint8Array(buffer);
  let off = 0, startWall = null;
  while (off + HDR <= bytes.length) {
    const type = view.getUint32(off, true);
    const len = view.getUint32(off + 4, true);
    if (!validChunk(type, len)) break;
    if (startWall === null) startWall = Number(view.getBigUint64(off + 8, true));
    if (off + HDR + len > bytes.length) break;         // chunk runs past the slice
    if (type === T_KEY) {
      const data = bytes.slice(off + HDR, off + HDR + len);
      return { startWall, keyframe: data, codec: codecFromKeyframe(data) };
    }
    off += HDR + len;
  }
  if (startWall === null) throw new Error("not a camera .media file");
  return { startWall, keyframe: null, codec: null };
}

/* Tail scan — find the last wall-clock stamp without reading the whole file.
   A chunk header's wall value is a Unix millisecond time, so we look for any
   8-byte little-endian value falling between the clip's start and an hour
   later and take the largest. Random video bytes landing inside a window that
   narrow is vanishingly unlikely, and a wrong answer only mis-states a
   duration in the list — it can't affect playback. */
function scanTailForEnd(buffer, startWall) {
  const view = new DataView(buffer);
  const hiWanted = Math.floor(startWall / 4294967296);
  const limit = startWall + 3600000;
  let best = 0;
  for (let i = 0; i + 8 <= view.byteLength; i++) {
    const hi = view.getUint32(i + 4, true);
    if (hi !== hiWanted) continue;
    const v = hi * 4294967296 + view.getUint32(i, true);
    if (v >= startWall && v <= limit && v > best) best = v;
  }
  return best;
}

async function decodeOneFrame(keyframe, codec) {
  const frames = [];
  const dec = new VideoDecoder({ output: f => frames.push(f), error: () => {} });
  dec.configure({ codec, optimizeForLatency: true });
  dec.decode(new EncodedVideoChunk({ type: "key", timestamp: 0, data: keyframe }));
  await dec.flush();
  try { dec.close(); } catch (e) {}
  if (!frames.length) throw new Error("could not decode a frame");
  const first = frames.shift();
  frames.forEach(f => f.close());
  return first;
}

/* ---------------------------------------------------------------------------
   Library
--------------------------------------------------------------------------- */

const $ = id => document.getElementById(id);
const els = {};
for (const id of ["library", "viewer", "groups", "empty", "count", "back", "more",
                  "pickFolder", "pickFiles", "fileFolder", "fileAny", "canvas",
                  "play", "time", "track", "fill", "rail", "prev", "next", "full",
                  "note", "title", "stage"]) els[id] = $(id);

const ctx2d = els.canvas.getContext("2d");
let clips = [];          // { file, name, startWall, endWall, duration, thumb, error, el }
let current = -1;

const two = n => String(n).padStart(2, "0");
const clockOf = d => two(d.getHours()) + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds());
const dayOf = d => d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });

function fmtLen(s) {
  if (s == null) return "";
  return Math.floor(s / 60) + ":" + two(Math.floor(s % 60));
}
function fmtPos(s) {
  s = Math.max(0, s);
  return Math.floor(s / 60) + ":" + two(Math.floor(s % 60)) + "." + Math.floor((s * 10) % 10);
}
function note(msg) {
  els.note.textContent = msg || "";
  els.note.classList.toggle("show", !!msg);
}

function collectFiles(list) {
  return [...list].filter(f => /\.media$/i.test(f.name));
}

async function addFiles(fileList) {
  const found = collectFiles(fileList);
  if (!found.length) {
    note("No .media files in that folder. Look for the folder on the card that holds the recordings.");
    return;
  }
  note("");
  clips = found.map(f => ({ file: f, name: f.name, startWall: null, duration: null, thumb: null, error: null }));
  els.empty.style.display = "none";
  els.more.hidden = false;
  render();
  await probeAll();
}

/* Read a small head and tail slice from each file, newest work first. */
async function probeAll() {
  let done = 0;
  for (const clip of clips) {
    try {
      const head = parseHead(await clip.file.slice(0, HEAD_BYTES).arrayBuffer());
      clip.startWall = head.startWall;

      const tailStart = Math.max(0, clip.file.size - TAIL_BYTES);
      const end = scanTailForEnd(await clip.file.slice(tailStart).arrayBuffer(), head.startWall);
      if (end > head.startWall) clip.duration = (end - head.startWall) / 1000;

      if (head.keyframe) {
        const frame = await decodeOneFrame(head.keyframe, head.codec);
        const w = 320, h = Math.round(w * frame.displayHeight / frame.displayWidth);
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(frame, 0, 0, w, h);
        frame.close();
        clip.thumb = cv.toDataURL("image/jpeg", 0.72);
      }
    } catch (err) {
      clip.error = err.message;
    }
    clip.probed = true;
    done++;
    els.count.textContent = done < clips.length
      ? `Reading clips… ${done} of ${clips.length}`
      : `${clips.length} clip${clips.length === 1 ? "" : "s"}`;
    if (done % 4 === 0 || done === clips.length) render();
  }
  render();
}

function render() {
  // Sort by recording time when known, falling back to filename order.
  const ordered = clips.slice().sort((a, b) => {
    if (a.startWall && b.startWall) return a.startWall - b.startWall;
    return a.name.localeCompare(b.name, undefined, { numeric: true });
  });

  const groups = [];
  for (const clip of ordered) {
    const label = clip.startWall ? dayOf(new Date(clip.startWall)) : "Date not readable";
    if (!groups.length || groups[groups.length - 1].label !== label) groups.push({ label, items: [] });
    groups[groups.length - 1].items.push(clip);
  }

  els.groups.innerHTML = "";
  for (const group of groups) {
    const section = document.createElement("div");
    section.className = "daygroup";
    const h2 = document.createElement("h2");
    h2.textContent = group.label;
    section.appendChild(h2);

    const grid = document.createElement("div");
    grid.className = "grid";
    for (const clip of group.items) {
      const card = document.createElement("button");
      card.className = "card" + (clip.error ? " bad" : "");
      card.innerHTML =
        `<div class="shot">${clip.thumb
            ? `<img alt="" src="${clip.thumb}">`
            : `<span class="wait">${clip.error ? "unreadable" : clip.probed ? "no preview" : "…"}</span>`}` +
        `${clip.duration != null ? `<span class="len">${fmtLen(clip.duration)}</span>` : ""}</div>` +
        `<div class="when">${clip.startWall ? clockOf(new Date(clip.startWall)) : "—"}</div>` +
        `<div class="file">${clip.name.replace(/\.media$/i, "")}</div>`;
      card.onclick = () => openClip(clips.indexOf(clip));
      grid.appendChild(card);
    }
    section.appendChild(grid);
    els.groups.appendChild(section);
  }
}

/* ---------------------------------------------------------------------------
   Viewer
--------------------------------------------------------------------------- */

let media = null, decoder = null, pktIndex = 0, queue = [];
let audioCtx = null, source = null, audioBuf = null;
let playing = false, clockBase = 0, clockStart = 0, rafId = 0;

const nowClock = () => playing
  ? clockBase + ((audioCtx ? audioCtx.currentTime : performance.now() / 1000) - clockStart)
  : clockBase;

function showLibrary() {
  stop();
  media = null;
  els.viewer.classList.add("hide");
  els.library.classList.remove("hide");
  els.back.hidden = true;
  els.more.hidden = false;
  els.title.textContent = "Camera clips";
}

async function openClip(index) {
  if (index < 0 || index >= clips.length) return;
  const clip = clips[index];
  stop();
  try {
    media = parseMedia(await clip.file.arrayBuffer());
  } catch (err) {
    note(clip.name + ": " + err.message);
    return;
  }
  note("");
  current = index;
  clip.duration = media.duration;
  if (!clip.startWall) clip.startWall = media.startWall;

  els.library.classList.add("hide");
  els.viewer.classList.remove("hide");
  els.back.hidden = false;
  els.more.hidden = true;
  const at = new Date(media.startWall);
  els.title.textContent = clip.name.replace(/\.media$/i, "");
  els.count.textContent = dayOf(at) + " at " + clockOf(at);

  audioBuf = null;
  if (media.pcm) {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioBuf = audioCtx.createBuffer(1, media.pcm.length, ARATE);
    audioBuf.copyToChannel(media.pcm, 0);
  }

  els.rail.querySelectorAll(".key").forEach(k => k.remove());
  for (const v of media.video) {
    if (!v.key) continue;
    const m = document.createElement("div");
    m.className = "key";
    m.style.left = (100 * v.t / media.duration) + "%";
    els.rail.appendChild(m);
  }

  await seek(0);
  play();
}

function flushQueue() { for (const f of queue) f.close(); queue = []; }

async function newDecoder() {
  if (decoder) { try { decoder.close(); } catch (e) {} }
  decoder = new VideoDecoder({
    output: f => queue.push(f),
    error: e => note("Decoder error: " + e.message)
  });
  decoder.configure({ codec: media.codec, optimizeForLatency: true });
}

function pump() {
  if (!decoder || decoder.state !== "configured") return;
  while (pktIndex < media.video.length && decoder.decodeQueueSize < 6 && queue.length < 12) {
    const p = media.video[pktIndex++];
    decoder.decode(new EncodedVideoChunk({
      type: p.key ? "key" : "delta",
      timestamp: Math.round(p.t * 1e6),
      data: p.data
    }));
  }
}

function draw(frame) {
  if (els.canvas.width !== frame.displayWidth) {
    els.canvas.width = frame.displayWidth;
    els.canvas.height = frame.displayHeight;
  }
  ctx2d.drawImage(frame, 0, 0);
}

async function seek(t) {
  if (!media) return;
  const wasPlaying = playing;
  stopAudio();
  t = Math.max(0, Math.min(t, media.duration));

  let start = 0;
  for (let i = 0; i < media.video.length; i++) {
    if (media.video[i].key && media.video[i].t <= t + 0.001) start = i;
  }
  pktIndex = start;
  flushQueue();
  await newDecoder();
  clockBase = t;
  playing = false;

  pump();
  const deadline = performance.now() + 3000;
  let shown = null;
  while (performance.now() < deadline) {
    while (queue.length) {
      const f = queue.shift();
      if (f.timestamp / 1e6 >= t - 0.001) { shown = f; break; }
      f.close();
    }
    if (shown || pktIndex >= media.video.length) break;
    pump();
    await new Promise(r => setTimeout(r, 4));
  }
  if (shown) { draw(shown); shown.close(); }
  update();
  if (wasPlaying) play();
}

function startAudio(from) {
  source = audioCtx.createBufferSource();
  source.buffer = audioBuf;
  source.connect(audioCtx.destination);
  source.start(0, Math.min(from, audioBuf.duration));
}
function stopAudio() {
  if (source) { try { source.stop(); } catch (e) {} source.disconnect(); source = null; }
}

function play() {
  if (!media || playing) return;
  if (clockBase >= media.duration - 0.01) { seek(0).then(play); return; }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  const from = clockBase;
  if (audioBuf) startAudio(from);
  clockBase = 0;
  clockStart = (audioCtx ? audioCtx.currentTime : performance.now() / 1000) - from;
  playing = true;
  els.play.textContent = "❚❚";
  tick();
}

function pause() {
  if (!playing) return;
  clockBase = nowClock();
  playing = false;
  stopAudio();
  els.play.textContent = "▶";
  cancelAnimationFrame(rafId);
  update();
}

function stop() {
  playing = false;
  stopAudio();
  cancelAnimationFrame(rafId);
  flushQueue();
  if (decoder) { try { decoder.close(); } catch (e) {} decoder = null; }
  clockBase = 0;
  els.play.textContent = "▶";
}

function tick() {
  if (!playing) return;
  const t = nowClock();
  while (queue.length && queue[0].timestamp / 1e6 <= t) {
    const f = queue.shift();
    draw(f);
    f.close();
  }
  pump();
  update();
  if (t >= media.duration) {
    pause();
    clockBase = media.duration;
    if (current < clips.length - 1) openClip(current + 1);
    return;
  }
  rafId = requestAnimationFrame(tick);
}

function update() {
  if (!media) return;
  const t = Math.min(nowClock(), media.duration);
  els.time.textContent = fmtPos(t) + " / " + fmtPos(media.duration);
  els.fill.style.width = (100 * t / media.duration) + "%";
}

/* ---------------------------------------------------------------------------
   Input
--------------------------------------------------------------------------- */

els.pickFolder.onclick = () => els.fileFolder.click();
els.pickFiles.onclick = () => els.fileAny.click();
els.more.onclick = () => els.fileFolder.click();
els.fileFolder.onchange = e => addFiles(e.target.files);
els.fileAny.onchange = e => addFiles(e.target.files);
els.back.onclick = showLibrary;
els.play.onclick = () => (playing ? pause() : play());
els.prev.onclick = () => openClip(current - 1);
els.next.onclick = () => openClip(current + 1);
els.full.onclick = () => document.fullscreenElement
  ? document.exitFullscreen() : els.stage.requestFullscreen();
els.track.onclick = e => {
  if (!media) return;
  const r = els.rail.getBoundingClientRect();
  seek(media.duration * (e.clientX - r.left) / r.width);
};

/* Drag and drop, including a dropped folder. */
async function entriesFrom(dataTransfer) {
  const roots = [...dataTransfer.items]
    .map(i => i.webkitGetAsEntry && i.webkitGetAsEntry())
    .filter(Boolean);
  if (!roots.length) return [...dataTransfer.files];
  const out = [];
  const walk = async entry => {
    if (entry.isFile) {
      out.push(await new Promise((res, rej) => entry.file(res, rej)));
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        if (!batch.length) break;
        for (const e of batch) await walk(e);
      }
    }
  };
  for (const r of roots) await walk(r);
  return out;
}

for (const type of ["dragenter", "dragover"]) {
  document.addEventListener(type, e => { e.preventDefault(); els.empty.classList.add("over"); });
}
document.addEventListener("dragleave", () => els.empty.classList.remove("over"));
document.addEventListener("drop", async e => {
  e.preventDefault();
  els.empty.classList.remove("over");
  addFiles(await entriesFrom(e.dataTransfer));
});

document.addEventListener("keydown", e => {
  if (els.viewer.classList.contains("hide")) return;
  if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === "ArrowLeft") seek(nowClock() - 5);
  else if (e.key === "ArrowRight") seek(nowClock() + 5);
  else if (e.key === "n") openClip(current + 1);
  else if (e.key === "p") openClip(current - 1);
  else if (e.key === "Escape" && !document.fullscreenElement) showLibrary();
});

if (!("VideoDecoder" in window)) {
  note("This browser can't decode the video. Chrome or Edge 94 or newer is needed.");
  els.pickFolder.disabled = els.pickFiles.disabled = true;
}
</script>
